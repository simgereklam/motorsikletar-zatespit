name: Build APK Direct

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # DEĞİŞİKLİK: Bulunamayan libncurses5-dev, libncursesw5-dev ve libtinfo5 listeden kaldırıldı.
    # Yerine Ubuntu 24.04 ile tam uyumlu 'libncurses-dev' eklendi.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --user buildozer cython==0.29.36 virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=$JAVA_HOME_17_X64
        yes | buildozer -v android debug
      env:
        P4A_RELEASE_KEYING: 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: efe-moto-diag-apk
        path: bin/*.apk
