name: Build APK Direct

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # OpenJDK kurulumu resmi eylem (action) ile daha stabil çalışır ve JAVA_HOME otomatik ayarlanır.
    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

    # Pip bağımlılıkları güncellendi, Cython sürümü sabitlendi
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --user buildozer cython virtualenv

    # Çevre değişkenleri tanımlandı ve interaktif sorular otomatik onaylandı
    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=$JAVA_HOME_17_X64
        yes | buildozer -v android debug

    # Çıktı klasöründeki APK'yı kaydetme adımı
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: efe-moto-diag-apk
        path: bin/*.apk
