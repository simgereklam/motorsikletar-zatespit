name: Build APK Direct

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Ubuntu 26.04 üzerindeki olası apt kilitlenmelerini önleyen ve modern kütüphaneleri kuran adım
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake

    # Cython sürümü obd ve Kivy WebView derleme araçlarıyla en kararlı çalışan sürüme sabitlendi
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --user buildozer cython==0.29.36 virtualenv

    # Önemli Adım: Önceki başarısız denemelerden kalan tüm hatalı kütüphane önbelleklerini sıfırlıyoruz
    - name: Clean Buildozer Cache
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android clean

    # Derleme adımı. Lisans onayları 'yes' ile otomatik geçilir
    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=$JAVA_HOME_17_X64
        yes | buildozer -v android debug
      env:
        P4A_RELEASE_KEYING: 0

    # Üretilen APK dosyasını GitHub Actions paneline yükleyen adım
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: efe-moto-diag-apk
        path: bin/*.apk
